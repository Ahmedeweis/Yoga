<!doctype html>
<html lang="en">

<head>
  <!-- تحديد ترميز الأحرف (UTF-8) لدعم جميع اللغات والعلامات -->
  <meta charset="utf-8" />

  <!-- جعل الصفحة متجاوبة مع جميع أحجام الشاشات والأجهزة المحمولة -->
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <!-- لضمان التوافق مع أحدث إصدارات متصفح Internet Explorer -->
  <meta http-equiv="x-ua-compatible" content="IE=edge" />

  <!-- تلوين شريط عنوان المتصفح على الهواتف ليتناسب مع هوية الموقع  E7DCD3 -->
  <meta name="theme-color" content="#E7DCD3" />

  <!-- لجعل الموقع يعمل كتطبيق أصلي (بدون شريط عنوان) عند إضافته للشاشة الرئيسية في أندرويد -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- نفس الخاصية السابقة ولكن لأجهزة iOS (iPhone/iPad) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- التحكم في شكل ولون شريط الحالة (Status Bar) في iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- منع الهاتف من تحويل الأرقام والعناوين تلقائيًا إلى روابط اتصال -->
  <meta name="format-detection" content="telephone=no,email=no,address=no" />

  <!-- عنوان الصفحة الذي يظهر في التبويب ونتائج محركات البحث (SEO) -->
  <title>Yoga Studio | Meditation, Wellness & Mindful Living Classes</title>

  <!-- وصف مختصر للصفحة يظهر أسفل العنوان في نتائج بحث جوجل (هام جدًا للـ SEO) -->
  <meta name="description"
    content="Transform your life through yoga, meditation, and wellness at ZenFlow Yoga Studio. Expert instructors, calming atmosphere, and holistic mind-body practices for healthy living. Join 150+ members on a journey to inner peace and body flow." />

  <!-- كلمات مفتاحية تساعد محركات البحث في فهم محتوى الموقع (أهميتها قلت حديثًا) -->
  <meta name="keywords"
    content="yoga studio, meditation classes, wellness center, mindfulness, yoga practice, breathing exercises, mind body connection, healthy lifestyle, yoga instructors, stretching, body flow, inner peace, holistic wellness, yoga community, fitness studio, mental health, stress relief, yoga meditation" />

  <!-- توجيه عناكب البحث (Google Bots) لأرشفة الصفحة وتتبع الروابط -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- حقوق الملكية الفكرية واسم المطور أو الشركة المالكة -->
  <meta name="author" content="Medtronic Yoga Studio" />
  <meta name="copyright" content="© 2025 Medtronic Yoga Studio. All rights reserved." />

  <!-- الرابط الأصلي للصفحة لمنع مشاكل المحتوى المكرر في محركات البحث -->
  <link rel="canonical" href="https://yogaa-five.vercel.app/" />

  <!-- بروتوكول تحسين شكل الرابط عند مشاركته على وسائل التواصل الاجتماعي (Facebook, WhatsApp, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Medtronic Yoga Studio" />
  <meta property="og:title" content="Medtronic Yoga Studio | Transform Your Life Through Meditation & Wellness" />
  <meta property="og:description"
    content="Expert yoga & meditation classes in a calming atmosphere. Join our wellness community today." />
  <meta property="og:image" content="https://yogaa-five.vercel.app/logo.png" />

  <meta property="og:image:alt" content="Medtronic Yoga Studio - Meditation and Wellness Classes" />
  <meta property="og:url" content="https://yogaa-five.vercel.app/" />
  <meta property="og:image:type" content="image/jpg">
  <meta property="og:locale" content="en_US" />

  <!-- بطاقات تويتر لتحسين شكل التغريدة عند مشاركة الرابط -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Medtronic Yoga Studio | Meditation, Wellness & Mindful Living" />
  <meta name="twitter:description"
    content="Transform your lifestyle with yoga, meditation & wellness classes. Expert instructors, calming atmosphere, and a supportive community. Experience the power of mindful living at ZenFlow." />
  <meta name="twitter:image" content="https://yogaa-five.vercel.app/logo.jpg" />
  <meta name="twitter:image:alt" content="Medtronic Yoga Studio - Peaceful meditation and yoga practice" />

  <!-- أيقونات الموقع التي تظهر في التبويب، المفضلة، وعلى الشاشة الرئيسية للهواتف -->
  <link rel="icon" href="/logo.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/logo.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/logo.png" sizes="any" />
  <link rel="icon" href="/logo.png" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/logo.png" sizes="180x180" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- ملف إعدادات تطبيق الويب التقدمي (PWA) للتحكم في الاسم والأيقونات عند التثبيت -->
  <link rel="manifest" href="/manifest.json" />

  <!-- فتح اتصال مبكر مع الخوادم لتقليل زمن تحميل المصادر الخارجية -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- تحميل الخطوط المستخدمة في التصميم -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- طلب تحميل الملفات المهمة (مثل الخطوط والسكريبتات الرئيسية) بأقصى سرعة -->
  <link rel="preload" href="/src/assets/fonts/Rubik-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/src/main.js" as="script">

  <!-- لون خلفية أيقونة التطبيق عند تثبيته على نظام Windows 8/10 -->
  <meta name="msapplication-TileColor" content="#E7DCD3" />

  <!-- اسم التطبيق المختصر الذي يظهر تحت الأيقونة على شاشة iPhone الرئيسية -->
  <meta name="apple-mobile-web-app-title" content="Medtronic Yoga Studio" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
